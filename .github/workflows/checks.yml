name: Checks and deploy

# Everything that can silently rot has a guard. The guards run first and the
# site is published only if they all pass, so a broken commit cannot reach the
# published page — the previous deploy simply stays live.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time, and never cancel one half-way.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  guards:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Per-page content files are current
        run: python3 build-content.py --check

      - name: Atlas layout is sound
        run: python3 scripts/check-atlas.py

      - name: Company map matches the value-chain database
        run: python3 brand/build-companies.py --check

      - name: Wording matches the approved baseline
        run: python3 check-content.py

      - name: No new undated figures
        run: python3 scripts/check-figures.py

      - name: Asset hashes are current
        run: |
          python3 bump-assets.py
          if ! git diff --quiet; then
            echo "::error::Asset hashes are stale. Run: python3 bump-assets.py"
            git --no-pager diff --stat
            exit 1
          fi

      - name: No remote asset loads
        run: python3 scripts/check-offline.py

      - name: Local links and assets resolve
        run: python3 scripts/check-site-links.py

      - name: Metadata and social card are complete
        run: python3 scripts/check-metadata.py

      - name: Basic accessibility shell is sound
        run: python3 scripts/check-a11y.py

      - name: Visual selectors and theme tokens are present
        run: python3 scripts/check-visual-contract.py

      - name: Performance budgets are respected
        run: python3 scripts/check-performance.py

      - name: Public deploy surface excludes local tools
        run: python3 scripts/check-public-surface.py

  # The pages in three real engines. Chromium alone is not enough: the white
  # rectangle round the planet was a Safari-only focus ring that survived
  # three rounds of review because nobody looked in WebKit.
  browsers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install Playwright with Chromium, Firefox and WebKit
        run: |
          pip install playwright==1.47.0 axe-playwright-python==0.1.4
          python -m playwright install --with-deps chromium firefox webkit

      - name: Pages load cleanly and accessibility does not regress
        run: python3 scripts/check-browsers.py

  deploy:
    needs: [guards, browsers]
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/configure-pages@v5

      - name: Stage the site
        run: |
          mkdir -p _site
          # atlas-editor.* is the local-only layout editor, and *.py are the
          # build scripts and guards: none of it is part of the public site.
          rsync -a --exclude='.git' --exclude='.github' --exclude='_site' \
                --exclude='CLEAN' --exclude='.DS_Store' \
                --exclude='atlas-editor.*' --exclude='*.py' ./ _site/
          touch _site/.nojekyll

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
