name: Refresh fundamentals

# The API key lives only here, in Actions secrets. It is never served to the
# browser: this job writes assets/market/fundamentals.json and commits it, and
# the site reads that file. Quotes refresh on every run; statements rotate
# through the company set so the free tier's daily call limit is respected.

on:
  schedule:
    - cron: '17 5 * * *'      # 05:17 UTC daily, after the US close
  workflow_dispatch:
    inputs:
      budget:
        description: 'Maximum FMP API calls for this run'
        required: false
        default: '200'

concurrency:
  group: fundamentals
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Fetch from Financial Modeling Prep
        env:
          FMP_API_KEY: ${{ secrets.FMP_API_KEY }}
        run: python3 scripts/fetch_fundamentals.py --budget "${{ github.event.inputs.budget || 200 }}"

      - name: Stamp assets so browsers pick up the new data
        run: python3 bump-assets.py

      - name: Commit if anything changed
        run: |
          if [ -z "$(git status --porcelain)" ]; then
            echo "No change in fundamentals; nothing to commit."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/market/fundamentals.json *.html
          git commit -m "Refresh fundamentals from FMP

          Automated by .github/workflows/fundamentals.yml."
          git push
