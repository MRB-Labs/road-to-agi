        <p class="d-cap">Three things at once, which is why it is not drawn as a stack. On the left, the industrial supply base that everything is made of. In the middle and on the right, the two physical enclosures where AI actually runs: the data centre, and the machine at the edge. Layers 4, 8 and 9 appear inside both, because the same capability class runs at two scales — that repetition is deliberate. Layer 6 is the only path between them, and the physical world above is not a layer at all but the ground the whole structure stands on.</p>

        <p class="d-cap">The two enclosures divide the work between them. The data centre runs the central learning loop — stored experience becomes curated datasets, datasets become training and evaluation, and evaluation becomes a validated update sent back out. The machine at the edge does none of that: it senses, decides and acts in real time. Layer 6 carries the traffic between them, which is exactly why safety-critical control must never depend on it. A robot that stops working when the link drops is not autonomous.</p>

        <h3>The loop</h3>
        <p class="d-sub">Read as a chain, the infrastructure stack is a value chain. Close it — actuators change the world, sensors observe the change — and it becomes a flywheel. That is the road to AGI, and it is what makes the thesis compound rather than merely grow.</p>

        <p class="d-cap"><b>Each turn generates data that could not have existed before that turn.</b> A model trained only on text learns what people have written about physics, not what physics does. Sensors close that gap by returning an error signal from reality itself — which is why a decade of fleet driving data cannot be bought, scraped or licensed by a competitor.</p>
        
        <p class="d-cap">The commercial consequence sits in the two corners nobody funds. Energy gates how fast the loop can turn; the actuator supply chain gates whether it can reach the physical world at all. Everything in between is where the capital has gone.</p>

<div class="ns-summary">
<p>This report draws its diagrams and tables with JavaScript. Here is the substance without it.</p>
<ol class="ns-layers">
<li><h3>Layer 1 &middot; Energy, power and utilities</h3><p>Generation, transmission, substations, electrical distribution gear and thermal management. An AI accelerator is a machine for converting electricity into inference — that is the whole business.</p><p><b>Binding constraint.</b> The chokepoint is <b>long-lead-time electrical equipment and turbine hot-section castings</b>, not generation. Global heavy-duty turbine capacity runs 60–70 GW a year against roughly 110 GW of outstanding orders, and the constraint is specialised foundries and skilled welders laid off during the lean 2010s.</p></li>
<li><h3>Layer 2 &middot; Raw and processed materials</h3><p>Ore, brine, gas and by-product streams, and the refining, separation and transformation steps that turn them into something a fab, a transformer or a magnet can actually use.</p><p><b>Binding constraint.</b> For most of these materials the chokepoint is <b>refining, separation and qualification rather than reserves in the ground</b> — but not for all of them: high-purity quartz is geologically concentrated, and by-product metals like gallium and germanium cannot be produced to order at any price. Mining is geographically diverse; refining is not. China holds 86–90% of rare earth separation, 48% of copper smelting against 8% of copper mining, and two mines in one North Carolina district supply roughly 80% of the world’s high-purity quartz.</p></li>
<li><h3>Layer 3 &middot; Semiconductor production ecosystem</h3><p>Design software and IP, wafer fabrication equipment, materials and chemicals, the foundry itself, and advanced packaging and test. Everything required to turn sand into a working advanced logic or memory die.</p><p><b>Binding constraint.</b> The bottleneck moved. For years it was lithography; it is now <b>advanced packaging</b> — bonding a logic die to twelve stacks of HBM on a silicon interposer. TSMC controls over 90% of global CoWoS output, and CoWoS allocation is effectively the revenue ceiling for every accelerator vendor.</p></li>
<li><h3>Layer 4 &middot; Compute, memory and networking</h3><p>The accelerators, the memory that feeds them, and the networking that binds them into a single training fabric. Highest revenue growth in the infrastructure stack, and the shortest moat half-life.</p><p><b>Binding constraint.</b> Three separate chokepoints, and memory is currently the tightest. <b>The most profitable chip company in history is guiding margins down because its memory suppliers raised prices</b> — value transferring up the supply chain against the buyer’s wishes is what a genuine bottleneck looks like.</p></li>
<li><h3>Layer 5 &middot; Data centres, cloud and edge</h3><p>The physical buildings and the operating businesses that sell capacity: hyperscale cloud, colocation and GPU-rental neoclouds. Four genuinely different business models that are routinely conflated.</p><p><b>Binding constraint.</b> This is no longer a technology sector. It is a <b>leveraged infrastructure sector wearing technology multiples</b>. Once the build-out is financed with debt, SPVs and depreciating collateral rather than operating cash flow, the right analytical toolkit is project finance, not software.</p></li>
<li><h3>Layer 6 &middot; Connectivity and communications</h3><p>The communications layer that links racks, buildings, continents and machines. It was missing from the earlier map: optics sat inside compute silicon, carrier networks appeared nowhere, and the path between the data centre and the edge was drawn as an arrow.</p><p><b>Binding constraint.</b> The chokepoints are geographic rather than manufactured. Metro conduit sits on rights of way that would not be granted again, and three firms outside China can lay a transoceanic system. <b>Neither constraint is relieved by capital expenditure, which is precisely what makes them durable.</b></p></li>
<li><h3>Layer 7 &middot; Data and knowledge infrastructure</h3><p>The data assets and the systems that govern them: ingestion, storage, cataloguing, cleaning, annotation, provenance and curation. It supports evaluation, retrieval and monitoring as much as training — and it was previously compressed into a single card inside the model layer.</p><p><b>Binding constraint.</b> The binding constraint here is legal rather than physical. Clear, transferable rights to train on third-party content are contested across several jurisdictions simultaneously, and lineage sufficient to evidence those rights <b>cannot be retrofitted once data is already mixed into a corpus.</b> That is a chokepoint with no lead time to shorten.</p></li>
<li><h3>Layer 8 &middot; AI models and inference</h3><p>Frontier training, post-training and alignment, inference serving, and the data pipelines that feed all of it. Where capital expenditure is converted into capability.</p><p><b>Binding constraint.</b> There may not be one. <b>Model weights are a depreciating asset</b>; a fab is not. The durable assets at this layer are proprietary data and distribution, not the weights themselves — which is why the vertically integrated players look structurally stronger than the pure-play labs.</p></li>
<li><h3>Layer 9 &middot; Agentic software and applications</h3><p>Orchestration frameworks, agent runtimes, vector and operational databases, observability, security, and the application software customers actually pay for.</p><p><b>Binding constraint.</b> Data gravity and systems of record. The scarce input is <b>context, not intelligence</b> — model capability is available to everyone at collapsing prices, but a company’s customer records, permission structures and process knowledge are not. Whoever owns the context owns the deployment.</p></li>
<li><h3>Layer 10 &middot; Embodied AI and autonomous systems</h3><p>Robots, vehicles, drones and devices, plus the actuators, reducers, sensors and batteries beneath them. Three industries at three completely different stages of maturity, routinely conflated.</p><p><b>Binding constraint.</b> <b>The geography inverts here.</b> Layers 3 and 4 concentrate in the Netherlands, Taiwan, Japan and Korea. Layer 10 concentrates in China, which holds 63% of humanoid component supply and over 70% of rare earth magnet production. Adding this layer to a semiconductor-heavy portfolio adds a second, oppositely-directed geopolitical exposure — it does not diversify the first.</p></li>
</ol>
