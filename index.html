    <div class="landing-rail">
      <h1>The physical infrastructure behind artificial intelligence</h1>
      <p class="lede">A ten-layer map of what AI is actually built on.</p>
    </div>


    <div class="dia-grid">
      <figure class="dia" style="margin:0">
        <div class="dia-head">
          <div>
            <h3>The infrastructure map</h3>
          </div>
          
        </div>
        <p class="d-sub">Three things at once, which is why it is not drawn as a stack. On the left, the industrial supply base that everything is made of. In the middle and on the right, the two physical enclosures where AI actually runs: the data centre, and the machine at the edge. Layers 4, 8 and 9 appear inside both, because the same capability class runs at two scales — that repetition is deliberate. Layer 6 is the only path between them, and the physical world above is not a layer at all but the ground the whole structure stands on.</p>
        <div class="dia-shell is-map">
        <div class="dia-chart">
        <svg id="mapsvg" viewBox="0 0 1560 880" role="group" aria-labelledby="d1t d1d">
          <title id="d1t">Physical architecture of the AI infrastructure stack</title>

          <text class="lb-m" data-from="2" x="780" y="838" text-anchor="middle">structures, magnets, cells, sensors and edge silicon into the machine</text>
        </svg>
        </div>
        <aside class="dia-info" id="mapinfo" aria-live="polite"></aside>
        </div>
      </figure>

      <figure class="dia" style="margin:0">
        <h3>The loop</h3>
        <p class="d-sub">Read as a chain, the infrastructure stack is a value chain. Close it — actuators change the world, sensors observe the change — and it becomes a flywheel. That is the road to AGI, and it is what makes the thesis compound rather than merely grow.</p>
        <div class="dia-shell is-loop">
        <div class="dia-chart">
        <svg id="loopsvg" viewBox="0 0 440 300" role="group" aria-labelledby="d2t d2d">
          <title id="d2t">The compounding loop</title>
          <desc id="d2d">A four-stage cycle: observe, learn, act, change, returning to observe.</desc>
          <g class="loop-node" data-stage="observe" tabindex="0" role="button" aria-label="Observe">
          <rect x="30" y="26" width="160" height="62" rx="8" class="bx b10"/>
          <text class="bt" x="110" y="52" text-anchor="middle">Observe</text>
          <text class="bs" x="110" y="70" text-anchor="middle">Sensors capture reality</text>
          </g>
          <g class="loop-node" data-stage="learn" tabindex="0" role="button" aria-label="Learn">
          <rect x="250" y="26" width="160" height="62" rx="8" class="bx b8"/>
          <text class="bt" x="330" y="52" text-anchor="middle">Learn</text>
          <text class="bs" x="330" y="70" text-anchor="middle">Data becomes models</text>
          </g>
          <g class="loop-node" data-stage="act" tabindex="0" role="button" aria-label="Act">
          <rect x="250" y="212" width="160" height="62" rx="8" class="bx b9"/>
          <text class="bt" x="330" y="238" text-anchor="middle">Act</text>
          <text class="bs" x="330" y="256" text-anchor="middle">Robots and agents work</text>
          </g>
          <g class="loop-node" data-stage="change" tabindex="0" role="button" aria-label="Change">
          <rect x="30" y="212" width="160" height="62" rx="8" class="bx b10"/>
          <text class="bt" x="110" y="238" text-anchor="middle">Change</text>
          <text class="bs" x="110" y="256" text-anchor="middle">New state, new data</text>
          </g>
          <path class="ln-a" d="M190 57 H244" marker-end="url(#ahA)"/>
          <path class="ln-a" d="M330 88 V206" marker-end="url(#ahA)"/>
          <path class="ln-a" d="M250 243 H196" marker-end="url(#ahA)"/>
          <path class="ln-a" d="M110 212 V94" marker-end="url(#ahA)"/>
        </svg>
        </div>
        <aside class="dia-info" id="loopinfo" aria-live="polite"></aside>
        </div>
        <p class="d-cap"><b>Each turn generates data that could not have existed before that turn.</b> A model trained only on text learns what people have written about physics, not what physics does. Sensors close that gap by returning an error signal from reality itself — which is why a decade of fleet driving data cannot be bought, scraped or licensed by a competitor.</p>
        
        <p class="d-cap">The commercial consequence sits in the two corners nobody funds. Energy gates how fast the loop can turn; the actuator supply chain gates whether it can reach the physical world at all. Everything in between is where the capital has gone.</p>
      </figure>
