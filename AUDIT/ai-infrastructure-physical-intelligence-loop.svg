<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1200" viewBox="0 0 1920 1200" role="img" aria-labelledby="title desc">
  <title id="title">Physical Architecture of the AI Infrastructure Stack</title>
  <desc id="desc">The industrial supply base, an AI data centre containing compute, data, models and cloud agents, connectivity to embodied edge systems containing sensors, edge compute, local models, agent control and actuators, and a closed perception-action-learning loop.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0f151d"/><stop offset="1" stop-color="#151d28"/></linearGradient>
    <radialGradient id="earth" cx="35%" cy="28%" r="72%"><stop stop-color="#77ddff"/><stop offset=".72" stop-color="#3188cf"/><stop offset="1" stop-color="#1d558c"/></radialGradient>
    <marker id="a-gray" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M1 1l7 3.5L1 8" fill="none" stroke="#607086" stroke-width="1.5"/></marker>
    <marker id="a-teal" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M1 1l7 3.5L1 8" fill="none" stroke="#4fd0c4" stroke-width="1.5"/></marker>
    <marker id="a-green" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M1 1l7 3.5L1 8" fill="none" stroke="#70cc78" stroke-width="1.5"/></marker>
    <marker id="a-blue" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M1 1l7 3.5L1 8" fill="none" stroke="#76a0ff" stroke-width="1.5"/></marker>
    <marker id="a-amber" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M1 1l7 3.5L1 8" fill="none" stroke="#eaae3f" stroke-width="1.5"/></marker>
    <marker id="a-coral" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M1 1l7 3.5L1 8" fill="none" stroke="#ed835c" stroke-width="1.5"/></marker>
    <style>
      .t{font-family:Inter,Arial,sans-serif}.h{fill:#f1f5f9;font-weight:750}.sub{fill:#94a1b2}.micro{fill:#7f8da0;font-size:12px;letter-spacing:.55px}.zone{fill:#718096;font-size:12px;font-weight:700;letter-spacing:2px}.card{stroke-width:1.6}.n{font:700 15px Inter,Arial,sans-serif;text-anchor:middle;dominant-baseline:middle}.flow{fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}.gray{stroke:#607086;marker-end:url(#a-gray)}.teal{stroke:#4fd0c4;marker-end:url(#a-teal)}.green{stroke:#70cc78;marker-end:url(#a-green)}.blue{stroke:#76a0ff;marker-end:url(#a-blue)}.amber{stroke:#eaae3f;marker-end:url(#a-amber)}.coral{stroke:#ed835c;marker-end:url(#a-coral)}
    </style>
  </defs>
  <rect width="1920" height="1200" fill="url(#bg)"/>
  <text x="55" y="51" class="t h" font-size="24">PHYSICAL ARCHITECTURE OF THE AI INFRASTRUCTURE STACK</text>
  <text x="1865" y="51" text-anchor="end" class="t sub" font-size="14">WHERE EACH CAPABILITY PHYSICALLY LIVES</text>
  <rect x="34" y="80" width="1852" height="1072" rx="20" fill="none" stroke="#334153" stroke-width="1.2" stroke-dasharray="8 9"/>

  <text x="67" y="132" class="t zone">INDUSTRIAL SUPPLY BASE</text>
  <rect x="58" y="151" width="425" height="931" rx="18" fill="#121a24" stroke="#334153" stroke-width="1.4"/>
  <g><rect class="card" x="83" y="200" width="375" height="122" rx="14" fill="#493211" stroke="#ecae3e"/><circle cx="119" cy="261" r="18" fill="#f1b94f"/><text x="119" y="262" class="n" fill="#332107">1</text><text x="151" y="244" class="t h" font-size="19">Energy, power and utilities</text><text x="151" y="272" class="t sub" font-size="14">Generation · grids · storage</text><text x="151" y="294" class="t sub" font-size="14">On-site power · cooling · water</text></g>
  <g><rect class="card" x="83" y="372" width="375" height="122" rx="14" fill="#482a1d" stroke="#ef895e"/><circle cx="119" cy="433" r="18" fill="#ef895e"/><text x="119" y="434" class="n" fill="#331b11">2</text><text x="151" y="416" class="t h" font-size="19">Raw and processed materials</text><text x="151" y="444" class="t sub" font-size="14">Mining · refining · electronic grade</text><text x="151" y="466" class="t sub" font-size="14">Metals · magnets · batteries · fibre</text></g>
  <g><rect class="card" x="83" y="544" width="375" height="122" rx="14" fill="#4a2530" stroke="#ef7895"/><circle cx="119" cy="605" r="18" fill="#ef7895"/><text x="119" y="606" class="n" fill="#351921">3</text><text x="151" y="588" class="t h" font-size="19">Semiconductor ecosystem</text><text x="151" y="616" class="t sub" font-size="14">EDA · equipment · wafers · foundry</text><text x="151" y="638" class="t sub" font-size="14">Packaging · memory · sensors · test</text></g>
  <rect x="83" y="728" width="375" height="282" rx="14" fill="#17202b" stroke="#2e3b4c"/>
  <text x="108" y="766" class="t h" font-size="16">WHAT FLOWS OUT</text>
  <circle cx="111" cy="803" r="5" fill="#eaae3f"/><text x="130" y="808" class="t sub" font-size="14">Electricity, cooling and water</text>
  <circle cx="111" cy="843" r="5" fill="#ed835c"/><text x="130" y="848" class="t sub" font-size="14">Chips, memory, sensors and optics</text>
  <circle cx="111" cy="883" r="5" fill="#ed835c"/><text x="130" y="888" class="t sub" font-size="14">Structural and actuator materials</text>
  <circle cx="111" cy="923" r="5" fill="#ed835c"/><text x="130" y="928" class="t sub" font-size="14">Batteries and power electronics</text>
  <circle cx="111" cy="963" r="5" fill="#7f8da0"/><text x="130" y="968" class="t sub" font-size="14">Replacement equipment and recycling</text>

  <rect x="540" y="151" width="790" height="931" rx="22" fill="#152039" stroke="#739aff" stroke-width="2.2"/>
  <circle cx="582" cy="194" r="20" fill="#739aff"/><text x="582" y="195" class="n" fill="#13213f">5</text>
  <text x="617" y="190" class="t h" font-size="24">AI data centre and cloud</text>
  <text x="617" y="218" class="t sub" font-size="14">The enclosure housing central compute, storage, data systems and cloud AI</text>
  <text x="1295" y="190" text-anchor="end" class="t micro">LAND · BUILDING · OPERATIONS · SECURITY</text>

  <rect class="card" x="580" y="257" width="710" height="112" rx="13" fill="#493211" stroke="#ecae3e"/>
  <circle cx="617" cy="313" r="17" fill="#f1b94f"/><text x="617" y="314" class="n" fill="#332107">1</text>
  <text x="650" y="300" class="t h" font-size="19">On-site electrical and thermal plant</text>
  <text x="650" y="328" class="t sub" font-size="14">Substation · switchgear · UPS · busway · backup power · liquid cooling · heat rejection</text>

  <rect class="card" x="580" y="397" width="710" height="122" rx="13" fill="#342849" stroke="#b892ef"/>
  <circle cx="617" cy="458" r="17" fill="#b892ef"/><text x="617" y="459" class="n" fill="#251a37">4</text>
  <text x="650" y="442" class="t h" font-size="19">Central compute, memory and networking</text>
  <text x="650" y="470" class="t sub" font-size="14">Accelerator racks · CPUs · HBM · storage · scale-up fabric · scale-out switches · optics</text>
  <text x="650" y="494" class="t micro">PHYSICAL MACHINES — THE EXECUTION ENGINE FOR LAYERS 7, 8 AND 9</text>

  <rect class="card" x="580" y="551" width="335" height="150" rx="13" fill="#223a35" stroke="#66bea8"/>
  <circle cx="617" cy="595" r="17" fill="#66bea8"/><text x="617" y="596" class="n" fill="#14271f">7</text>
  <text x="650" y="588" class="t h" font-size="18">Data and knowledge</text>
  <text x="606" y="627" class="t sub" font-size="14">Databases · object storage · data lakes</text><text x="606" y="650" class="t sub" font-size="14">Ingestion · curation · governance</text><text x="606" y="675" class="t micro">PERSISTS SENSOR + ENTERPRISE DATA</text>

  <rect class="card" x="955" y="551" width="335" height="150" rx="13" fill="#173c38" stroke="#50cfc3"/>
  <circle cx="992" cy="595" r="17" fill="#50cfc3"/><text x="992" y="596" class="n" fill="#102623">8</text>
  <text x="1025" y="588" class="t h" font-size="18">Training and cloud inference</text>
  <text x="981" y="627" class="t sub" font-size="14">Pre-training · post-training · evaluation</text><text x="981" y="650" class="t sub" font-size="14">Model serving · routing · optimisation</text><text x="981" y="675" class="t micro">MODEL WEIGHTS + INFERENCE RUNTIME</text>

  <rect class="card" x="580" y="742" width="710" height="126" rx="13" fill="#25313d" stroke="#9baabd"/>
  <circle cx="617" cy="805" r="17" fill="#9baabd"/><text x="617" y="806" class="n" fill="#19222c">9</text>
  <text x="650" y="790" class="t h" font-size="19">Cloud agent services and applications</text>
  <text x="650" y="818" class="t sub" font-size="14">Retrieval · memory · tools · orchestration · identity · observability · applications</text>
  <text x="650" y="842" class="t micro">SOME AGENTS REMAIN IN THE CLOUD; OTHERS ARE DEPLOYED TO THE EDGE</text>

  <rect x="580" y="916" width="710" height="116" rx="13" fill="#182235" stroke="#334760"/>
  <text x="606" y="950" class="t h" font-size="16">CENTRAL LEARNING LOOP</text>
  <text x="606" y="978" class="t sub" font-size="14">Stored experience → curated datasets → training/evaluation → validated model update</text>
  <text x="606" y="1004" class="t micro">THE DATA CENTRE TRAINS; THE EDGE SENSES, DECIDES AND ACTS IN REAL TIME</text>

  <rect x="1354" y="500" width="142" height="142" rx="18" fill="#18333b" stroke="#55bad2" stroke-width="2"/>
  <circle cx="1425" cy="534" r="18" fill="#55bad2"/><text x="1425" y="535" class="n" fill="#10252b">6</text>
  <text x="1425" y="570" text-anchor="middle" class="t h" font-size="15">CONNECTIVITY</text><text x="1425" y="594" text-anchor="middle" class="t sub" font-size="12">Fibre · 5G</text><text x="1425" y="613" text-anchor="middle" class="t sub" font-size="12">Wi-Fi · satellite</text>

  <rect x="1518" y="210" width="335" height="800" rx="22" fill="#173221" stroke="#70cc78" stroke-width="2.2"/>
  <circle cx="1558" cy="251" r="19" fill="#70cc78"/><text x="1558" y="252" class="n" fill="#13291a">10</text>
  <text x="1591" y="246" class="t h" font-size="21">Embodied AI</text><text x="1591" y="272" class="t sub" font-size="13">Robot · vehicle · drone</text>

  <rect x="1547" y="316" width="277" height="90" rx="12" fill="#1d3c29" stroke="#70cc78"/><text x="1571" y="346" class="t h" font-size="17">Sensors</text><text x="1571" y="372" class="t sub" font-size="13">Vision · tactile · audio</text><text x="1571" y="392" class="t sub" font-size="13">proprioception · environment</text>
  <rect x="1547" y="438" width="277" height="92" rx="12" fill="#342849" stroke="#b892ef"/><circle cx="1576" cy="484" r="15" fill="#b892ef"/><text x="1576" y="485" class="n" fill="#251a37">4</text><text x="1604" y="475" class="t h" font-size="16">Edge compute</text><text x="1604" y="501" class="t sub" font-size="13">SoC · memory · real-time I/O</text>
  <rect x="1547" y="562" width="277" height="92" rx="12" fill="#173c38" stroke="#50cfc3"/><circle cx="1576" cy="608" r="15" fill="#50cfc3"/><text x="1576" y="609" class="n" fill="#102623">8</text><text x="1604" y="599" class="t h" font-size="16">Local models</text><text x="1604" y="625" class="t sub" font-size="13">Perception · world model · policy</text>
  <rect x="1547" y="686" width="277" height="92" rx="12" fill="#25313d" stroke="#9baabd"/><circle cx="1576" cy="732" r="15" fill="#9baabd"/><text x="1576" y="733" class="n" fill="#19222c">9</text><text x="1604" y="723" class="t h" font-size="16">Agent and control</text><text x="1604" y="749" class="t sub" font-size="13">Planning · tools · safety · control</text>
  <rect x="1547" y="810" width="277" height="90" rx="12" fill="#1d3c29" stroke="#70cc78"/><text x="1571" y="840" class="t h" font-size="17">Actuators</text><text x="1571" y="866" class="t sub" font-size="13">Motors · drives · joints</text><text x="1571" y="886" class="t sub" font-size="13">wheels · grippers · effectors</text>
  <rect x="1547" y="928" width="277" height="52" rx="10" fill="#24301f" stroke="#879d4e"/><text x="1686" y="960" text-anchor="middle" class="t sub" font-size="13">Battery · power · thermal system</text>

